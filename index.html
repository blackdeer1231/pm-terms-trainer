<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>PM Terms Trainer</title><style>
:root{--bg:#f5f5f2;--card:#fff;--text:#171717;--muted:#6d6d68;--line:#deded8;--good:#eaf6eb;--bad:#fdebea}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}.wrap{max-width:900px;margin:auto;padding:18px 16px 80px}header{position:sticky;top:0;background:rgba(245,245,242,.95);backdrop-filter:blur(12px);padding:12px 0;z-index:2}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}.nav,.filters,.actions{display:flex;gap:8px;overflow:auto;margin-top:12px}button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font-weight:700;color:#171717}.nav button.on,.filters button.on,.primary{background:#111;color:#fff;border-color:#111}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}.flash{min-height:370px;display:flex;flex-direction:column;justify-content:space-between}.cat{font-size:12px;color:var(--muted)}.term{font-size:30px;font-weight:800;margin:10px 0 16px}.def{font-size:20px;line-height:1.45}.memo{margin-top:14px;background:#f6f6f2;padding:13px;border-radius:13px;font-weight:700}.progress{height:9px;background:#e7e7e2;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:#111}.hidden{display:none!important}.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:16px;margin:14px 0}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.item small{display:block;margin-top:5px;color:var(--muted)}.q{font-size:22px;font-weight:800;line-height:1.35;margin:16px 0}.opts{display:grid;gap:9px}.opts button{text-align:left}.good{background:var(--good)!important}.bad{background:var(--bad)!important}.feedback{background:#f6f6f2;padding:14px;border-radius:13px;margin-top:14px;line-height:1.45}footer{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}@media(max-width:650px){.stats{grid-template-columns:1fr}.term{font-size:27px}}</style></head><body><div class="wrap"><header><h1>PM Terms Trainer</h1><div class="sub">Product Manager • Saber interview prep</div><div class="nav"><button class="on" data-v="learn">Карточки</button><button data-v="quiz">Тест</button><button data-v="terms">Словарь</button></div></header><div class="stats"><div class="stat"><b id="sTotal"></b><span>терминов</span></div><div class="stat"><b id="sKnown"></b><span>знаю</span></div><div class="stat"><b id="sAcc"></b><span>точность тестов</span></div></div><section id="learn"><div class="filters" id="lf"></div><div class="card flash"><div><div class="cat" id="fc"></div><div class="term" id="ft"></div><div id="back" class="hidden"><div class="def" id="fd"></div><div class="memo" id="fm"></div></div></div><div><div class="progress"><i id="fp"></i></div><div class="actions"><button class="primary" id="show">Показать ответ</button><button id="again" class="hidden">Повторить</button><button id="known" class="hidden">Знаю</button><button id="next">Следующая</button></div></div></div></section><section id="quiz" class="hidden"><div class="card"><div class="actions"><button id="newq">Новый тест</button></div><div class="progress" style="margin-top:14px"><i id="qp"></i></div><div id="qb"></div></div></section><section id="terms" class="hidden"><input class="search" id="search" placeholder="Найти термин…"><div class="filters" id="tf"></div><div class="list" id="list"></div></section><footer>Прогресс хранится на этом устройстве. После первого открытия приложение работает офлайн.</footer></div>
<script>window.TERMS=[];</script><script src="terms-1.js"></script><script src="terms-2.js"></script><script src="terms-3.js"></script><script src="terms-4.js"></script><script src="terms-5.js"></script><script>
const TERMS=window.TERMS,cats=["Все",...new Set(TERMS.map(x=>x.category))].sort();let known=JSON.parse(localStorage.getItem("pm_known")||"{}"),qc=+localStorage.getItem("pm_qc")||0,qt=+localStorage.getItem("pm_qt")||0;let lc="Все",tc="Все",idx=0,reveal=false,quiz=[],qi=0,answered=false;const $=id=>document.getElementById(id),filt=c=>c==="Все"?TERMS:TERMS.filter(x=>x.category===c),sh=a=>[...a].sort(()=>Math.random()-.5);function save(){localStorage.setItem("pm_known",JSON.stringify(known));localStorage.setItem("pm_qc",qc);localStorage.setItem("pm_qt",qt);stats()}function stats(){$("sTotal").textContent=TERMS.length;$("sKnown").textContent=Object.values(known).filter(Boolean).length;$("sAcc").textContent=qt?Math.round(qc/qt*100)+"%":"0%"}function filters(el,active,cb){el.innerHTML="";cats.forEach(c=>{let b=document.createElement("button");b.textContent=c;if(c===active)b.classList.add("on");b.onclick=()=>cb(c);el.appendChild(b)})}function drawFilters(){filters($("lf"),lc,c=>{lc=c;idx=0;reveal=false;drawFilters();renderCard()});filters($("tf"),tc,c=>{tc=c;drawFilters();renderTerms()})}function renderCard(){let a=filt(lc);idx=(idx+a.length)%a.length;let t=a[idx];$("fc").textContent=t.category;$("ft").textContent=t.term;$("fd").textContent=t.definition;$("fm").textContent="Запомнить: "+t.memory;$("back").classList.toggle("hidden",!reveal);$("show").classList.toggle("hidden",reveal);$("again").classList.toggle("hidden",!reveal);$("known").classList.toggle("hidden",!reveal);$("fp").style.width=((idx+1)/a.length*100)+"%"}function next(){idx++;reveal=false;renderCard()}$("show").onclick=()=>{reveal=true;renderCard()};$("next").onclick=next;$("known").onclick=()=>{known[filt(lc)[idx].term]=true;save();next()};$("again").onclick=()=>{known[filt(lc)[idx].term]=false;save();next()};function renderTerms(){let q=$("search").value.toLowerCase();$("list").innerHTML=filt(tc).filter(t=>!q||(t.term+" "+t.definition).toLowerCase().includes(q)).map(t=>'<div class="item"><b>'+t.term+'</b><small>'+t.definition+'</small></div>').join("")}$("search").oninput=renderTerms;function buildQuiz(){quiz=sh(TERMS).slice(0,10).map(c=>{let w=sh(TERMS.filter(x=>x.term!==c.term&&x.category===c.category)).slice(0,3);if(w.length<3)w=sh(TERMS.filter(x=>x.term!==c.term)).slice(0,3);return{c,opts:sh([c,...w])}});qi=0;answered=false;renderQuiz()}function renderQuiz(){if(qi>=quiz.length){$("qp").style.width="100%";$("qb").innerHTML='<div class="q">Тест завершён</div><p>Общая точность: <b>'+(qt?Math.round(qc/qt*100):0)+'%</b></p><button class="primary" onclick="buildQuiz()">Ещё 10 вопросов</button>';return}let q=quiz[qi];$("qp").style.width=(qi/quiz.length*100)+"%";$("qb").innerHTML='<div class="q">Что означает «'+q.c.term+'»?</div><div class="opts">'+q.opts.map((o,i)=>'<button data-t="'+encodeURIComponent(o.term)+'">'+String.fromCharCode(65+i)+'. '+o.definition+'</button>').join("")+'</div><div id="fb"></div>';document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>answer(b,decodeURIComponent(b.dataset.t)))}function answer(btn,t){if(answered)return;answered=true;let q=quiz[qi],ok=t===q.c.term;qt++;if(ok)qc++;save();document.querySelectorAll(".opts button").forEach(b=>{let x=decodeURIComponent(b.dataset.t);if(x===q.c.term)b.classList.add("good");else if(b===btn)b.classList.add("bad");b.disabled=true});$("fb").innerHTML='<div class="feedback"><b>'+(ok?"Верно":"Нужно повторить")+'</b><br>'+q.c.definition+'<br><br><b>Мнемоника:</b> '+q.c.memory+'</div><div class="actions"><button class="primary" id="qn">Дальше</button></div>';$("qn").onclick=()=>{qi++;answered=false;renderQuiz()}}$("newq").onclick=buildQuiz;document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");["learn","quiz","terms"].forEach(v=>$(v).classList.toggle("hidden",v!==b.dataset.v))});drawFilters();renderCard();renderTerms();buildQuiz();stats();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");</script></body></html>
